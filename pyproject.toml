[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homeworkflow"
version = "0.3.0"
description = "Local-first weekly homework checklist, OMR review, and reporting app"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.128.8",
  "uvicorn==0.39.0",
  "reportlab==4.4.9",
  "qrcode[pil]==8.2",
  "numpy==2.0.2; python_version < '3.10'",
  "numpy==2.2.6; python_version >= '3.10'",
  "opencv-python-headless==4.12.0.88",
  "openpyxl==3.1.5",
  "pypdfium2==4.30.0",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pypdf==6.10.0",
  "pytest==8.4.2",
]

[project.scripts]
homeworkflow = "homeworkflow.main:run"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
